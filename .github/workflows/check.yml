# Every push and pull request: the plugin passes Tessera's own check (tools/check.py of the plugins repository).
name: check
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: MaxGramser/tessera-plugins
          path: .tessera-plugins
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 .tessera-plugins/tools/check.py .
