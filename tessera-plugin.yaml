# Photo slideshow: your own photos (a holiday, the kids, the dog) large on a tile. Home Assistant picks the photo: a
# template sensor whose state is the photo's address (an image entity, /api/image_proxy/...), a new one every few
# minutes (homeassistant/photo_slideshow.yaml). The tile shows it, slides to the next one when it changes, and a tap
# asks for the next. Since 0.3.0 it also brings a face for Tessera's own Photos screensaver (plugin API 0.14): the
# same caption over the photo the screensaver shows.
# Every field is explained in docs/MANIFEST.md of the plugins repository.
id: photo_slideshow
version: 0.4.0
api: "0.14"
icon: image
maintainer: DJSmile-T
license: MIT
stage: beta
topics: [photos]
requires:
  esphome: 2026.6.2
boards: any
flash_kb: 6

permissions:
  # A tap, and the tile's own interval, press the button the sensor names in its attribute next_button: Home
  # Assistant picks the next photo.
  home_assistant_actions: [input_button.press]

tiles:
  - id: slideshow
    name: tile_name
    icon: image
    sizes: { min: 1x1, max: 9x9 }
    # The photo's place, the band with three lines and the message.
    memory: 900
    # One place for the photo. A board without the memory for pictures says so instead.
    pictures: 1
    # The slideshow sensor of Home Assistant (README, "Set up"): its state is the photo's address.
    domains: [sensor]
    attributes: [caption, next_button, photo_name, place, photo_date]
    has_attributes: [next_button]
    example: tile_example
    preview: { title: "{caption}" }
    options:
      - { id: fit, kind: choice, label: fit, hint: fit_hint, default: cover,
          choices: [{ value: cover, label: fit_cover }, { value: contain, label: fit_contain }] }
      - { id: caption, kind: toggle, label: caption, hint: caption_hint, default: true }
      - { id: name, kind: toggle, label: photo_name, hint: photo_name_hint, default: false }
      - { id: place, kind: toggle, label: place, hint: place_hint, default: true }
      - { id: date, kind: toggle, label: photo_date, hint: photo_date_hint, default: false }
      - { id: time, kind: toggle, label: clock, hint: clock_hint, default: false }
      - { id: corner, kind: choice, label: corner, hint: corner_hint, default: bottom_left,
          choices: [{ value: bottom_left, label: bottom_left }, { value: bottom_right, label: bottom_right },
                    { value: top_left, label: top_left }, { value: top_right, label: top_right }] }
      - { id: slide, kind: toggle, label: slide, hint: slide_hint, default: true }
      - { id: interval, kind: number, label: interval, hint: interval_hint, default: 0, min: 0, max: 3600, step: 5,
          unit: s }

savers:
  # A face of Tessera's own Photos step (0.4.89): a person picks it under Face in the drawer of Photos. The step picks
  # the photo from a media folder of Home Assistant and shows it under the face; the face draws the caption over it.
  - id: caption
    name: saver_name
    icon: image
    step: photos
    # The band and its two lines.
    memory: 400
    # The step's own photo under the face, over the whole glass, moving when the person chose Motion: Slow.
    backdrop: true
    example: saver_example
    options:
      - { id: corner, kind: choice, label: corner, hint: corner_hint, default: bottom_left,
          choices: [{ value: bottom_left, label: bottom_left }, { value: bottom_right, label: bottom_right },
                    { value: top_left, label: top_left }, { value: top_right, label: top_right }] }
      - { id: title, kind: text, label: saver_title, hint: saver_title_hint }
      - { id: numbers, kind: toggle, label: numbers, hint: numbers_hint, default: true }
      - { id: time, kind: toggle, label: saver_time, hint: saver_time_hint, default: false }
  # A step of its own: the slideshow sensor's photo over the whole glass in standby, with every detail the tile has.
  - id: slideshow
    name: saver_own_name
    icon: image
    step: own
    # The photo's place, the band with three lines and the message.
    memory: 900
    pictures: 1
    domains: [sensor]
    attributes: [caption, next_button, photo_name, place, photo_date]
    when: always
    example: saver_own_example
    options:
      - { id: fit, kind: choice, label: fit, hint: fit_hint, default: cover,
          choices: [{ value: cover, label: fit_cover }, { value: contain, label: fit_contain }] }
      - { id: caption, kind: toggle, label: caption, hint: caption_hint, default: true }
      - { id: name, kind: toggle, label: photo_name, hint: photo_name_hint, default: false }
      - { id: place, kind: toggle, label: place, hint: place_hint, default: true }
      - { id: date, kind: toggle, label: photo_date, hint: photo_date_hint, default: false }
      - { id: time, kind: toggle, label: clock, hint: clock_hint, default: true }
      - { id: corner, kind: choice, label: corner, hint: corner_hint, default: bottom_left,
          choices: [{ value: bottom_left, label: bottom_left }, { value: bottom_right, label: bottom_right },
                    { value: top_left, label: top_left }, { value: top_right, label: top_right }] }
      - { id: interval, kind: number, label: interval, hint: interval_hint, default: 0, min: 0, max: 3600, step: 5,
          unit: s }
